[package]
name = "spindoctor-qwerty"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"
authors = ["RUSSELL PHILIP SMITHSON <russellsmithson77@outlook.com>"]
description = "Zed extension that registers the SpinDoctor Qwerty stdio MCP server (SpinDoctor 3.1.2 simulator parity)."
